<div class="df-grid">
  <div class="df-field">
    <label>カテゴリ</label>
    <select name="category" id="catSelect">
      {% for c in DETAIL_CATEGORIES %}<option value="{{ c }}" {{ 'selected' if item.category == c else '' }}>{{ c }}</option>{% endfor %}
    </select>
  </div>
  <div class="df-field" id="fld-subtype">
    <label id="lbl-subtype">手段</label>
    <select name="subtype" id="subtypeSelect" data-current="{{ item.subtype or '' }}"></select>
  </div>
  <div class="df-field full">
    <label id="lbl-name">名称</label>
    <input type="text" name="name" id="nameInput" value="{{ item.name or '' }}" placeholder="名称" required>
  </div>
  <div class="df-field" id="fld-from">
    <label>出発地</label>
    <input type="text" name="place_from" value="{{ item.place_from or '' }}" placeholder="例：羽田空港">
  </div>
  <div class="df-field" id="fld-to">
    <label>到着地</label>
    <input type="text" name="place_to" value="{{ item.place_to or '' }}" placeholder="例：那覇空港">
  </div>
  <div class="df-field" id="fld-timefrom">
    <label id="lbl-timefrom">出発時刻</label>
    <input type="time" name="time_from" value="{{ item.time_from or '' }}">
  </div>
  <div class="df-field" id="fld-timeto">
    <label id="lbl-timeto">到着時刻</label>
    <input type="time" name="time_to" value="{{ item.time_to or '' }}">
  </div>
  <div class="df-field">
    <label>費用（円）</label>
    <input type="number" name="cost" min="0" step="100" value="{{ item.cost or '' }}" placeholder="0">
  </div>
  <div class="df-field">
    <label id="lbl-url">リンク</label>
    <input type="text" name="url" value="{{ item.url or '' }}" placeholder="URL（任意）">
  </div>
  <div class="df-field full">
    <label>メモ</label>
    <input type="text" name="info" value="{{ item.info or '' }}" placeholder="メモ（任意）">
  </div>
</div>
