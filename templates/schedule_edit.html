{% extends "base.html" %}
{% block title %}予定を編集 — Tabi{% endblock %}
{% block content %}
<style>
  .edit-wrap { max-width: 560px; margin: 0 auto; }
  .edit-wrap h1 { font-size: 1.5rem; margin: 0 0 22px; }
  .field { margin-bottom: 18px; }
  .field label { display:block; font-weight:700; font-size:0.9rem; margin-bottom:6px; }
  .field .req { color: var(--danger); font-size: 0.8rem; }
  .field input {
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:11px;
    font-size:0.97rem; font-family:inherit; background:var(--surface); color:var(--ink); }
  .field input:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:14px; }
  .form-actions { margin-top:24px; display:flex; gap:12px; }
  .back { display:inline-block; color:var(--muted); text-decoration:none; font-size:0.88rem; margin-bottom:14px; }
  .back:hover { color:var(--accent); }
  @media (max-width:560px){ .row { flex-direction:column; gap:0; } }
</style>

<a class="back" href="{{ url_for('detail', trip_id=trip.id) }}#schedule">← {{ trip.title }} に戻る</a>

<div class="edit-wrap">
  <h1>予定を編集</h1>
  <form method="post" action="{{ url_for('edit_schedule', item_id=item.id) }}">
    <div class="row">
      <div class="field" style="max-width:130px;">
        <label>何日目</label>
        <input type="number" name="day" min="1" value="{{ item.day }}">
      </div>
      <div class="field" style="max-width:170px;">
        <label>時刻</label>
        <input type="time" name="time" value="{{ item.time or '' }}">
      </div>
    </div>
    <div class="field">
      <label>予定 <span class="req">必須</span></label>
      <input type="text" name="activity" value="{{ item.activity }}" placeholder="例：清水寺を観光" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">保存する</button>
      <a href="{{ url_for('detail', trip_id=trip.id) }}#schedule" class="btn btn-ghost">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
