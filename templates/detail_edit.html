{% extends "base.html" %}
{% block title %}詳細を編集 — Tabi{% endblock %}
{% block content %}
<style>
  .edit-wrap { max-width: 620px; margin: 0 auto; }
  .edit-wrap h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .edit-wrap .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 22px; }
  .df-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; width:100%; }
  .df-field { display:flex; flex-direction:column; gap:5px; }
  .df-field.full { grid-column:1 / -1; }
  .df-field label { font-size:0.85rem; font-weight:700; color:var(--ink); }
  .df-field input, .df-field select {
    padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:0.95rem;
    font-family:inherit; background:var(--surface); width:100%; }
  .df-field input:focus, .df-field select:focus { outline:none; border-color:var(--accent); }
  .df-actions { margin-top:24px; display:flex; gap:12px; }
  @media (max-width:560px){ .df-grid { grid-template-columns:1fr; } }
  .back { display:inline-block; color:var(--muted); text-decoration:none; font-size:0.88rem; margin-bottom:14px; }
  .back:hover { color:var(--accent); }
</style>

<a class="back" href="{{ url_for('detail', trip_id=trip.id) }}#details">← {{ trip.title }} に戻る</a>

<div class="edit-wrap">
  <h1>詳細を編集</h1>
  <p class="sub">カテゴリを変えると入力欄が切り替わります。</p>
  <form method="post" action="{{ url_for('edit_detail', item_id=item.id) }}">
    {% include '_detail_fields.html' %}
    <div class="df-actions">
      <button type="submit" class="btn btn-primary">保存する</button>
      <a href="{{ url_for('detail', trip_id=trip.id) }}#details" class="btn btn-ghost">キャンセル</a>
    </div>
  </form>
</div>

<script src="{{ url_for('static', filename='detail_form.js') }}"></script>
{% endblock %}
