{% extends "base.html" %}
{% block title %}{{ heading }} — Tabi{% endblock %}
{% block content %}
<style>
  .form-wrap { max-width: 620px; margin: 0 auto; }
  .form-wrap h1 { font-size: 1.5rem; margin: 0 0 22px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; }
  .field .req { color: var(--danger); font-size: 0.8rem; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px;
    font-size: 0.97rem; font-family: inherit; background: var(--surface); color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 14px; }
  .row .field { flex: 1; }
  .memo-block {
    margin-top: 26px; padding-top: 22px; border-top: 1px dashed var(--line);
  }
  .form-actions { margin-top: 26px; display: flex; gap: 12px; }
  .hint { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }
  @media (max-width: 560px) { .row { flex-direction: column; gap: 0; } }
</style>

<div class="form-wrap">
  <h1>{{ heading }}</h1>
  <form method="post" action="{{ action }}">
    <div class="field">
      <label>旅行名 <span class="req">必須</span></label>
      <input type="text" name="title" value="{{ trip.title or '' }}" placeholder="例：夏の沖縄ぐるり旅" required>
    </div>
    <div class="field">
      <label>行き先 <span class="req">必須</span></label>
      <input type="text" name="destination" value="{{ trip.destination or '' }}" placeholder="例：沖縄県" required>
    </div>
    <div class="row">
      <div class="field">
        <label>開始日</label>
        <input type="date" name="start_date" value="{{ trip.start_date or '' }}">
      </div>
      <div class="field">
        <label>終了日</label>
        <input type="date" name="end_date" value="{{ trip.end_date or '' }}">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>予算（円）</label>
        <input type="number" name="budget" min="0" step="1000" value="{{ trip.budget or 0 }}">
      </div>
      <div class="field">
        <label>ステータス</label>
        <select name="status">
          {% for s in STATUS_CHOICES %}
            <option value="{{ s }}" {{ 'selected' if trip.status == s else '' }}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="memo-block">
      <div class="field" style="margin-bottom:0;">
        <label>メモ</label>
        <textarea name="memo" placeholder="持ち物、気をつけること、思い出など自由に…">{{ trip.memo or '' }}</textarea>
        <div class="hint">旅程・詳細情報・アルバムは、保存後の詳細ページから追加できます。</div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">保存する</button>
      {% if trip.id %}
        <a href="{{ url_for('detail', trip_id=trip.id) }}" class="btn btn-ghost">キャンセル</a>
      {% else %}
        <a href="{{ url_for('index') }}" class="btn btn-ghost">キャンセル</a>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}
